name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      # Errors block the build; the remaining `any` warnings are tracked
      # separately and do not fail CI yet.
      - run: npx eslint . --max-warnings=-1
      # Structural audits: seconds-fast and stable green; they gate regressions.
      # audit:schema stays manual until the drift recorded in
      # docs/DB_SCHEMA_DRIFT_2026-11-16.md is fixed (owner db push + type regen).
      - run: npm run audit:dead
      - run: npm run audit:mocks
      - run: npm run test:wa-worker
      - run: npx vitest run --coverage
      - run: npx vite build

  e2e-functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The functional config builds and serves the production preview itself
      # (webServer: npm run build && vite preview on :4173).
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
