# Supabase Auto-Deploy
# Deploys database migrations and Edge Functions to Supabase.
# Triggers on push to main (after frontend deploy) and manual dispatch.

name: Supabase Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:
    inputs:
      deploy_database:
        description: 'Run database migrations'
        type: boolean
        default: false
      deploy_functions:
        description: 'Deploy Edge Functions'
        type: boolean
        default: true

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Applied Migrations
        if: github.event_name == 'push'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          MIGRATION_BEFORE_SHA: ${{ github.event.before }}
          MIGRATION_AFTER_SHA: ${{ github.sha }}
        run: node scripts/verify-applied-supabase-migrations.mjs

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Database Migrations
        id: database
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_database }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          echo "🔄 Linking to Supabase project..."
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --token "$SUPABASE_ACCESS_TOKEN"

          echo "📦 Pushing database migrations..."
          supabase db push --db-url "postgresql://postgres:${{ secrets.SUPABASE_DB_PASSWORD }}@db.$SUPABASE_PROJECT_ID.supabase.co:5432/postgres" --include-all

      - name: Deploy Edge Functions
        id: functions
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_functions || github.event_name == 'push' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          echo "🚀 Deploying Edge Functions..."
          supabase functions deploy dispatch-push --project-ref "$SUPABASE_PROJECT_ID" --token "$SUPABASE_ACCESS_TOKEN" --no-verify-jwt
          supabase functions deploy wa-worker --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          supabase functions deploy openrouter --project-ref "$SUPABASE_PROJECT_ID" --token "$SUPABASE_ACCESS_TOKEN" --no-verify-jwt || true

      - name: Verify Teacher Reminders
        id: reminders
        if: ${{ github.event_name == 'push' || inputs.deploy_database || inputs.deploy_functions }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          node scripts/verify-teacher-reminders.mjs

      - name: Deployment summary
        if: always()
        env:
          DATABASE_OUTCOME: ${{ steps.database.outcome }}
          FUNCTIONS_OUTCOME: ${{ steps.functions.outcome }}
          REMINDERS_OUTCOME: ${{ steps.reminders.outcome }}
        run: |
          echo "## Supabase Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Database migrations: $DATABASE_OUTCOME" >> $GITHUB_STEP_SUMMARY
          echo "- Edge Functions: $FUNCTIONS_OUTCOME" >> $GITHUB_STEP_SUMMARY
          echo "- Teacher reminders: $REMINDERS_OUTCOME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 Dashboard: https://supabase.com/dashboard/project/${{ secrets.SUPABASE_PROJECT_ID }}" >> $GITHUB_STEP_SUMMARY
